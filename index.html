<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUTSAL GALAMUDA - 32 Team Tournament Bracket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom scrollbars for a premium feel */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #0f172a; border-radius: 8px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; border: 2px solid #0f172a; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Ensure contenteditable looks correct when empty */
        [contenteditable]:empty:before { content: "\feff"; display: block; min-width: 1em; }
        
        .champion-glow {
            box-shadow: 0 0 35px rgba(250, 204, 21, 0.7);
            border-color: #facc15 !important;
            transform: scale(1.05);
            transition: all 0.5s ease-out;
        }

        /* Dot grid background for the bracket canvas area */
        .dot-grid {
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Tambahan Tema Futsal */
        .stadium-bg {
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 60%, #020617 100%);
        }
        
        .scoreboard-input {
            background-color: #000;
            color: #22c55e;
            font-family: monospace;
            font-size: 1.1rem;
        }
        
        .match-card {
            border-radius: 0.75rem;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Number input spinner hiding */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-slate-950 text-white h-screen flex flex-col overflow-hidden selection:bg-green-500 selection:text-white">

    <!-- Header -->
    <header class="bg-slate-900/80 backdrop-blur-md border-b border-green-500/30 px-6 py-4 flex justify-between items-center shadow-[0_4px_30px_rgba(34,197,94,0.15)] z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-12 h-12 bg-gradient-to-br from-green-400 to-green-600 rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(34,197,94,0.4)] border-2 border-slate-900">
                <svg class="w-7 h-7 text-slate-900" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-3xl font-black tracking-widest text-green-400">FUTSAL<span class="text-white">PRO</span></h1>
                <p class="text-xs text-slate-400 font-semibold tracking-wide">32-TEAM KNOCKOUT STAGE</p>
            </div>
        </div>
        <div class="flex items-center space-x-6">
            <div class="hidden md:flex flex-col text-right text-xs text-slate-400 font-medium">
                <span>Click team names to edit.</span>
                <span>Enter scores and click advance button.</span>
            </div>
            <button onclick="confirmReset()" class="bg-red-500/10 hover:bg-red-500/20 text-red-500 border border-red-500/50 px-4 py-2 rounded-lg font-bold text-sm transition-colors duration-200">
                Reset Bracket
            </button>
        </div>
    </header>

    <!-- Main Scrollable Area -->
    <main class="flex-1 overflow-auto stadium-bg relative">
        <!-- Inner container stretching wide enough for all 9 columns -->
        <div id="bracket-inner" class="min-w-[2800px] min-h-[900px] h-full p-12 relative flex dot-grid opacity-95">
            
            <!-- Canvas for drawing connecting lines -->
            <canvas id="lines-canvas" class="absolute top-0 left-0 w-full h-full z-0 pointer-events-none"></canvas>
            
            <!-- Bracket DOM Nodes -->
            <div id="bracket-container" class="flex justify-between items-stretch w-full h-full z-10 relative">
                <!-- Columns will be injected here via JavaScript -->
            </div>
            
        </div>
    </main>

    <!-- Custom Toast Notification -->
    <div id="toast" style="opacity: 0; transform: translate(-50%, 100%); pointer-events: none;" class="fixed bottom-8 left-1/2 px-8 py-4 rounded-xl shadow-2xl transition-all duration-300 z-50 font-bold text-white text-center min-w-[300px] text-sm uppercase tracking-wide border border-white/20">
        Message
    </div>

    <!-- Confirmation Modal for Reset -->
    <div id="reset-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 max-w-sm w-full text-center transform scale-95 transition-transform duration-200" id="reset-modal-content">
            <div class="w-16 h-16 bg-red-500/20 rounded-full flex items-center justify-center mx-auto mb-4 text-red-500">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
            </div>
            <h3 class="text-xl font-bold text-white mb-2">Reset Entire Bracket?</h3>
            <p class="text-slate-400 text-sm mb-6">This will wipe all custom team names, scores, and advancements. This action cannot be undone.</p>
            <div class="flex space-x-3">
                <button onclick="closeResetModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-white py-2.5 rounded-lg font-semibold transition-colors">Cancel</button>
                <button onclick="executeReset()" class="flex-1 bg-red-500 hover:bg-red-600 text-white py-2.5 rounded-lg font-semibold transition-colors shadow-lg shadow-red-500/30">Yes, Reset</button>
            </div>
        </div>
    </div>

    <script>
        // -- DATA STRUCTURE & STATE MANAGEMENT --
        let matches = {};
        
        // Define the next match logic and which slot (1 = top, 2 = bottom) the winner goes into
        const setup = {
            1: {next: 17, slot: 1}, 2: {next: 17, slot: 2}, 3: {next: 18, slot: 1}, 4: {next: 18, slot: 2},
            5: {next: 19, slot: 1}, 6: {next: 19, slot: 2}, 7: {next: 20, slot: 1}, 8: {next: 20, slot: 2},
            17: {next: 25, slot: 1}, 18: {next: 25, slot: 2}, 19: {next: 26, slot: 1}, 20: {next: 26, slot: 2},
            25: {next: 29, slot: 1}, 26: {next: 29, slot: 2}, 29: {next: 31, slot: 1},
            
            9: {next: 21, slot: 1}, 10: {next: 21, slot: 2}, 11: {next: 22, slot: 1}, 12: {next: 22, slot: 2},
            13: {next: 23, slot: 1}, 14: {next: 23, slot: 2}, 15: {next: 24, slot: 1}, 16: {next: 24, slot: 2},
            21: {next: 27, slot: 1}, 22: {next: 27, slot: 2}, 23: {next: 28, slot: 1}, 24: {next: 28, slot: 2},
            27: {next: 30, slot: 1}, 28: {next: 30, slot: 2}, 30: {next: 31, slot: 2},
            
            31: {next: null, slot: null}
        };

        // UI Columns map
        const cols = [
            { id: 'c1', matches: [1,2,3,4,5,6,7,8], side: 'left', title: 'Round of 32 (Pool A)' },
            { id: 'c2', matches: [17,18,19,20], side: 'left', title: 'Round of 16' },
            { id: 'c3', matches: [25,26], side: 'left', title: 'Quarter-Finals' },
            { id: 'c4', matches: [29], side: 'left', title: 'Semi-Finals' },
            { id: 'c5', matches: [31], side: 'center', title: 'Grand Final' },
            { id: 'c6', matches: [30], side: 'right', title: 'Semi-Finals' },
            { id: 'c7', matches: [27,28], side: 'right', title: 'Quarter-Finals' },
            { id: 'c8', matches: [21,22,23,24], side: 'right', title: 'Round of 16' },
            { id: 'c9', matches: [9,10,11,12,13,14,15,16], side: 'right', title: 'Round of 32 (Pool B)' },
        ];

        function createDefaultMatches() {
            let initialMatches = {};
            for (let i = 1; i <= 31; i++) {
                initialMatches[i] = {
                    id: i,
                    t1: '', t2: '',
                    s1: '', s2: '',
                    next: setup[i].next,
                    slot: setup[i].slot
                };
            }

            // Assign 32 default teams
            for (let i = 0; i < 8; i++) {
                // Pool A
                initialMatches[i+1].t1 = `Team A${i*2 + 1}`;
                initialMatches[i+1].t2 = `Team A${i*2 + 2}`;
                // Pool B
                initialMatches[i+9].t1 = `Team B${i*2 + 1}`;
                initialMatches[i+9].t2 = `Team B${i*2 + 2}`;
            }
            return initialMatches;
        }

        function saveState() {
            localStorage.setItem('futsalBracketData', JSON.stringify(matches));
        }

        function loadState() {
            const saved = localStorage.getItem('futsalBracketData');
            if (saved) {
                try {
                    matches = JSON.parse(saved);
                    return true;
                } catch(e) { console.error("Error parsing save data"); }
            }
            return false;
        }

        function init() {
            if (!loadState()) {
                matches = createDefaultMatches();
                saveState();
            }
            render();
            // Wait for DOM & Fonts before drawing perfect lines
            document.fonts.ready.then(() => {
                setTimeout(drawLines, 100);
            });
        }

        // -- RENDERING LOGIC --
        function render() {
            const container = document.getElementById('bracket-container');
            container.innerHTML = '';

            cols.forEach((col, index) => {
                const colDiv = document.createElement('div');
                // Use precise flex heights instead of justify-around for perfect geometric alignment
                colDiv.className = 'flex flex-col items-center h-full w-56 relative';
                
                // Column Header
                const titleDiv = document.createElement('div');
                titleDiv.className = 'absolute -top-6 text-[11px] font-bold text-slate-400 uppercase tracking-widest w-full text-center whitespace-nowrap bg-slate-900/90 border border-slate-700/50 rounded py-1.5 shadow-lg z-20';
                titleDiv.innerText = col.title;
                colDiv.appendChild(titleDiv);
                
                col.matches.forEach(mId => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'w-full flex items-center justify-center relative';
                    // Precisely divide the vertical space based on matches in this round
                    wrapper.style.height = `${100 / col.matches.length}%`;
                    wrapper.innerHTML = generateMatchHTML(mId, col.side);
                    colDiv.appendChild(wrapper);
                });
                
                container.appendChild(colDiv);
            });

            drawLines();
        }

        function generateMatchHTML(mId, side) {
            const match = matches[mId];
            const isFinal = mId === 31;
            
            const borderClass = isFinal ? 'border-yellow-400 shadow-[0_0_20px_rgba(250,204,21,0.3)]' : 'border-slate-700 hover:border-green-500/80 hover:shadow-[0_0_15px_rgba(34,197,94,0.2)]';
            const bgHeaderClass = isFinal ? 'bg-gradient-to-r from-yellow-500 via-yellow-300 to-yellow-500 text-slate-900' : 'bg-slate-900 text-slate-400 border-b border-slate-800';
            
            let btnHtml = '';
            if (!isFinal) {
                const isLeft = side === 'left';
                const posClass = isLeft ? '-right-4' : '-left-4';
                const iconDir = isLeft ? 'M9 5l7 7-7 7' : 'M15 19l-7-7 7-7';
                
                btnHtml = `<button onclick="advanceWinner(${mId})" class="absolute ${posClass} top-1/2 transform -translate-y-1/2 w-8 h-8 bg-slate-800 hover:bg-green-500 border-2 border-slate-900 rounded-full flex items-center justify-center z-20 transition-all duration-300 group shadow-lg" title="Advance Winner">
                    <svg class="w-4 h-4 text-white group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="${iconDir}"></path></svg>
                </button>`;
            } else {
                btnHtml = `<button onclick="declareChampion()" class="absolute -bottom-6 left-1/2 transform -translate-x-1/2 w-12 h-12 bg-gradient-to-br from-yellow-400 to-yellow-600 hover:from-yellow-300 hover:to-yellow-500 border-4 border-slate-900 rounded-full flex items-center justify-center z-20 transition-all duration-300 group shadow-[0_0_20px_rgba(250,204,21,0.6)] hover:scale-110" title="Declare Champion">
                    <svg class="w-6 h-6 text-slate-900" fill="currentColor" viewBox="0 0 20 20"><path d="M5 4a2 2 0 012-2h6a2 2 0 012 2v14l-5-2.5L5 18V4z"></path></svg>
                </button>`;
            }

            // Shield icon placeholder for teams
            const shieldSVG = `<svg class="w-4 h-4 text-slate-500 opacity-70 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`;

            return `
                <div id="match-${mId}" class="match-card border-2 ${borderClass} w-full relative flex flex-col transition-all duration-300 z-10 bg-slate-800/80 backdrop-blur-sm rounded-xl">
                    <div class="${bgHeaderClass} text-[10px] font-black uppercase tracking-widest text-center py-1.5 rounded-t-lg">
                        ${isFinal ? '🏆 GRAND FINAL 🏆' : 'MATCH ' + mId}
                    </div>
                    
                    <div class="p-2 space-y-1.5">
                        <div class="flex items-center justify-between group bg-slate-950/50 rounded-md p-1.5 border border-slate-700/50">
                            <div class="flex items-center flex-1 min-w-0 pr-2 space-x-1.5">
                                ${shieldSVG}
                                <span class="flex-1 min-w-0 text-sm font-bold truncate text-gray-100 outline-none focus:bg-slate-700 focus:text-white rounded px-1 cursor-text transition-colors" contenteditable="true" onblur="updateTeam(${mId}, 1, this.innerText)" title="${match.t1}">${match.t1}</span>
                            </div>
                            <input type="number" min="0" class="scoreboard-input w-10 h-8 border border-slate-700 text-center font-bold rounded focus:border-${isFinal?'yellow':'green'}-500 focus:ring-1 focus:ring-${isFinal?'yellow':'green'}-500 outline-none transition-all shrink-0" value="${match.s1}" onchange="updateScore(${mId}, 1, this.value)" placeholder="-">
                        </div>
                        <div class="flex items-center justify-between group bg-slate-950/50 rounded-md p-1.5 border border-slate-700/50">
                            <div class="flex items-center flex-1 min-w-0 pr-2 space-x-1.5">
                                ${shieldSVG}
                                <span class="flex-1 min-w-0 text-sm font-bold truncate text-gray-100 outline-none focus:bg-slate-700 focus:text-white rounded px-1 cursor-text transition-colors" contenteditable="true" onblur="updateTeam(${mId}, 2, this.innerText)" title="${match.t2}">${match.t2}</span>
                            </div>
                            <input type="number" min="0" class="scoreboard-input w-10 h-8 border border-slate-700 text-center font-bold rounded focus:border-${isFinal?'yellow':'green'}-500 focus:ring-1 focus:ring-${isFinal?'yellow':'green'}-500 outline-none transition-all shrink-0" value="${match.s2}" onchange="updateScore(${mId}, 2, this.value)" placeholder="-">
                        </div>
                    </div>
                    ${btnHtml}
                </div>
            `;
        }

        // -- DYNAMIC CANVAS CONNECTING LINES --
        function drawLines() {
            const canvas = document.getElementById('lines-canvas');
            const inner = document.getElementById('bracket-inner');
            const ctx = canvas.getContext('2d');
            
            const dpr = window.devicePixelRatio || 1;
            const rect = inner.getBoundingClientRect();
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;
            
            ctx.clearRect(0, 0, rect.width, rect.height);
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            
            function getRect(id) {
                const el = document.getElementById(`match-${id}`);
                if(!el) return null;
                const elRect = el.getBoundingClientRect();
                // Get coords relative to the scrolling container's inner content
                return {
                    x: elRect.left - rect.left,
                    y: elRect.top - rect.top,
                    w: elRect.width,
                    h: elRect.height
                };
            }
            
            for (let i = 1; i <= 31; i++) {
                const match = matches[i];
                if (!match.next) continue;
                
                const rect1 = getRect(i);
                const rect2 = getRect(match.next);
                
                if (!rect1 || !rect2) continue;
                
                const isLeft = [1,2,3,4,5,6,7,8,17,18,19,20,25,26,29].includes(i);
                const hasWinner = matches[i].s1 !== '' && matches[i].s2 !== '' && (parseInt(matches[i].s1) !== parseInt(matches[i].s2));
                
                // Highlight line in Neon Green if match is completed
                ctx.strokeStyle = hasWinner ? '#22c55e' : '#475569'; 
                ctx.shadowColor = hasWinner ? '#22c55e' : 'transparent';
                ctx.shadowBlur = hasWinner ? 8 : 0;
                ctx.beginPath();

                if (isLeft) {
                    const startX = rect1.x + rect1.w;
                    const startY = rect1.y + rect1.h / 2;
                    const endX = rect2.x;
                    const endY = rect2.y + rect2.h / 2;
                    
                    ctx.moveTo(startX, startY);
                    const midX = startX + (endX - startX) / 2;
                    ctx.lineTo(midX, startY);
                    ctx.lineTo(midX, endY);
                    ctx.lineTo(endX, endY);
                } else {
                    // Pool B (draws right to left visually)
                    const startX = rect1.x;
                    const startY = rect1.y + rect1.h / 2;
                    const endX = rect2.x + rect2.w;
                    const endY = rect2.y + rect2.h / 2;
                    
                    ctx.moveTo(startX, startY);
                    const midX = startX + (endX - startX) / 2;
                    ctx.lineTo(midX, startY);
                    ctx.lineTo(midX, endY);
                    ctx.lineTo(endX, endY);
                }
                ctx.stroke();
            }
        }

        window.addEventListener('resize', drawLines);

        // -- INTERACTION & LOGIC --
        window.updateTeam = function(id, teamNum, val) {
            // Clean zero-width chars and trim
            const cleanVal = val.replace(/\uFEFF/g, '').trim();
            if (teamNum === 1) matches[id].t1 = cleanVal;
            if (teamNum === 2) matches[id].t2 = cleanVal;
            saveState();
        };

        window.updateScore = function(id, teamNum, val) {
            if (teamNum === 1) matches[id].s1 = val;
            if (teamNum === 2) matches[id].s2 = val;
            saveState();
        };

        window.advanceWinner = function(id) {
            const match = matches[id];
            const s1 = match.s1 === '' ? null : parseInt(match.s1);
            const s2 = match.s2 === '' ? null : parseInt(match.s2);
            
            if (s1 === null || s2 === null) {
                showToast("Please enter scores for both teams before advancing.", "error");
                return;
            }
            if (s1 === s2) {
                showToast("Match is tied! Adjust scores to determine a winner.", "error");
                return;
            }
            if (!match.t1 || !match.t2) {
                showToast("Both team names must be filled to advance.", "error");
                return;
            }
            
            const winner = s1 > s2 ? match.t1 : match.t2;
            const nextId = match.next;
            const slot = match.slot;
            
            if (slot === 1) {
                matches[nextId].t1 = winner;
            } else {
                matches[nextId].t2 = winner;
            }
            
            // Clear scores for the new match segment
            matches[nextId].s1 = '';
            matches[nextId].s2 = '';
            
            saveState();
            render(); 
            showToast(`✅ ${winner} advanced to next round!`, "success");
        };

        window.declareChampion = function() {
            const match = matches[31];
            const s1 = match.s1 === '' ? null : parseInt(match.s1);
            const s2 = match.s2 === '' ? null : parseInt(match.s2);
            
            if (s1 === null || s2 === null || s1 === s2) {
                showToast("Enter valid, winning scores to crown the Champion!", "error");
                return;
            }
            
            const winner = s1 > s2 ? match.t1 : match.t2;
            const finalCard = document.getElementById('match-31');
            
            // Visual flair
            finalCard.classList.add('champion-glow');
            setTimeout(() => { finalCard.classList.remove('champion-glow'); }, 3000);
            
            showToast(`🏆 ${winner.toUpperCase()} IS THE CHAMPION! 🏆`, "champion");
        };

        // -- UI HELPERS --
        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            
            // Reset classes
            toast.className = 'fixed bottom-8 left-1/2 px-8 py-4 rounded-xl shadow-2xl transition-all duration-300 z-50 font-bold text-white text-center min-w-[300px] text-sm uppercase tracking-wide border border-white/20';
            
            if (type === 'error') {
                toast.classList.add('bg-red-600');
            } else if (type === 'success') {
                toast.classList.add('bg-emerald-600');
            } else if (type === 'champion') {
                toast.classList.add('bg-yellow-500', 'text-slate-900', 'border-yellow-300', 'shadow-[0_0_40px_rgba(250,204,21,0.6)]', 'text-lg');
            } else {
                toast.classList.add('bg-blue-600');
            }
            
            toast.style.transform = 'translate(-50%, 0)';
            toast.style.opacity = '1';
            
            setTimeout(() => {
                toast.style.transform = 'translate(-50%, 100%)';
                toast.style.opacity = '0';
            }, 3500);
        }

        // Modals
        window.confirmReset = function() {
            const modal = document.getElementById('reset-modal');
            const content = document.getElementById('reset-modal-content');
            modal.classList.remove('hidden');
            // Small timeout to allow display:block to apply before animating scale
            setTimeout(() => content.classList.replace('scale-95', 'scale-100'), 10);
        };

        window.closeResetModal = function() {
            const modal = document.getElementById('reset-modal');
            const content = document.getElementById('reset-modal-content');
            content.classList.replace('scale-100', 'scale-95');
            setTimeout(() => modal.classList.add('hidden'), 200);
        };

        window.executeReset = function() {
            matches = createDefaultMatches();
            saveState();
            render();
            closeResetModal();
            showToast("Bracket has been successfully reset.", "success");
        };

        // Bootstrap App
        init();

    </script>
</body>
</html>
